defaults_schema_version = 2
product_defaults_version = 2

[foundation_diagnostics]
total_bytes = 268435456
file_bytes = 8388608
event_bytes = 65536
text_bytes = 16384
max_depth = 8
max_container_entries = 100
max_closed_files = 32
retention_days = 30

[profile_defaults]
persona_text = "You are Jarvis, a polite, composed, professional, competent, and respectful local assistant. Be concise when appropriate, subtly sophisticated, and proactive without being intrusive. Match the language currently used by the user unless the profile context explicitly directs otherwise. Do not imitate or quote copyrighted fictional dialogue."
profile_context_text = ""
accent_color = "#4fc3f7"
foreground_color = "#e6edf3"
background_color = "#0d1117"
waiting_messages = []
goodbye_messages = []
visible_logging_mode = "essential-minimum"
start_with_computer = false

[profile_defaults.permissions]
create = "allow"
copy = "allow"
read = "allow"
screen = "allow"
internet = "allow"
execute = "allow"
delete = "ask"
modify = "ask"
move = "ask"
